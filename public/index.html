<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLUB · Placemaking Laboratory Urban Bureau</title>
<meta name="description" content="Bangkok's Great Good Places on one map: 57,538 cafés, co-working spaces, libraries and restaurants, scored from open data, with Nong Plub as your guide.">
<meta property="og:title" content="PLUB · Placemaking Laboratory Urban Bureau">
<meta property="og:description" content="Find your Great Good Place in Bangkok. Neighbourhood stories, data-driven scores, and a passport of where you've been.">
<meta property="og:image" content="https://co.nonarkara.org/og/default.png?v=visual-20261103">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#7d133a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/plub-192.png?v=visual-20261103">
<link rel="apple-touch-icon" href="/icons/plub-192.png?v=visual-20261103">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Prompt:wght@400;500&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/SaoChingcha-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="style.css?v=visual-20261103b" rel="stylesheet">
<link href="notebook.css?v=visual-20261103" rel="stylesheet">
<link href="discovery.css?v=visual-20261103" rel="stylesheet">
<link href="atlas.css?v=atlas-20261103" rel="stylesheet">
<link href="journeys.css?v=journeys-20261103" rel="stylesheet">
</head>
<body>
<header class="bar">
  <a class="mark" href="/" aria-label="PLUB, Placemaking Laboratory Urban Bureau, home" title="PLUB · Placemaking Laboratory ; Urban Bureau">PL<span class="semi">;</span>UB</a>
  <label class="search">
    <span class="sr">Search places · <span lang="th">ค้นหาสถานที่</span></span>
    <input id="q" type="search" placeholder="Find a place" autocomplete="off" enterkeyhint="search">
  </label>
  <button id="guide" class="iconbtn plub-btn" aria-label="Nong Plub's guide: neighbourhoods and how places are scored"></button>
  <button id="passport" class="iconbtn pass-btn" aria-label="Your notebook"><span>Notes</span><b id="pass-n">0</b></button>
  <ul id="hits" class="hits" role="listbox" hidden></ul>
</header>

<nav class="chips" aria-label="Filters">
  <button id="list-toggle" class="phone-only" aria-pressed="false" title="List and filters">☰ List</button>
  <button data-kind="cafe" aria-pressed="true"><i class="dot cafe"></i>Café</button>
  <button data-kind="coworking" aria-pressed="true"><i class="dot coworking"></i>Co-work</button>
  <button data-kind="library" aria-pressed="true"><i class="dot library"></i>Library</button>
  <button data-kind="restaurant" aria-pressed="false"><i class="dot restaurant"></i>Food</button>
</nav>

<main id="map" aria-label="Map of Great Good Places in Bangkok"></main>

<aside id="side" class="side">
  <section id="list-wrap" class="list-wrap" aria-label="Places in view">
    <div class="moods" aria-label="Find">
      <button data-act="discovery">50 + 50 cafés</button>
      <button data-act="now">◎ Near me now</button>
      <button data-act="hop">Café hop</button>
      <button data-mood="slow" aria-pressed="false">◐ Slow mornings</button>
      <button data-mood="midnight" aria-pressed="false">◐ Past midnight</button>
      <button data-mood="crossing" aria-pressed="false">◐ Crossing paths</button>
      <button data-mood="afterwork" aria-pressed="false">◐ After work</button>
    </div>
    <p id="mood" class="mood-bar" hidden aria-live="polite"></p>
    <div class="flags" aria-label="Filters">
      <button data-flag="wifi" aria-pressed="false" title="Wi-Fi listed or rated">≋ Wi-Fi</button>
      <button data-flag="open" aria-pressed="false" title="Open now (where hours are known)">◷ Open</button>
      <button data-flag="indie" aria-pressed="false" title="Independent, not a chain">◇ Indie</button>
      <button data-flag="visited" aria-pressed="false" title="Places you've been">✓ Been</button>
      <output id="count" class="count" aria-live="polite">…</output>
    </div>
    <div class="sorts" role="tablist" aria-label="Sort places">
      <button role="tab" data-sort="great" aria-selected="true" title="Great Good Place index">✦ Great</button>
      <button role="tab" data-sort="near" aria-selected="false" title="Nearest to the map centre">◎ Near</button>
      <button role="tab" data-sort="popular" aria-selected="false" title="Listed by the most datasets and channels (not foot traffic)">▲ Known</button>
      <button role="tab" data-sort="notable" aria-selected="false" title="Wikidata, Wikipedia or heritage record">◆ Notable</button>
      <button role="tab" data-sort="work" aria-selected="false" title="Co-working, library, Wi-Fi, visitor scores">≋ Work</button>
      <button class="close list-close phone-only" aria-label="Close list">×</button>
    </div>
    <ol id="list" class="list"></ol>
  </section>
  <section id="sheet" class="sheet" hidden aria-live="polite"></section>
</aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="hours.js?v=visual-20261103"></script>
<script src="plub.js?v=visual-20261103"></script>
<script src="passport.js?v=visual-20261103"></script>
<script src="atlas-model.js?v=atlas-20261103"></script>
<script src="atlas.js?v=journeys-20261103"></script>
<script src="journey-model.js?v=journeys-20261103"></script>
<script src="journeys.js?v=journeys-20261103"></script>
<script src="app.js?v=journeys-20261103"></script>
<script src="views.js?v=journeys-20261103"></script>
<script src="notebook.js?v=visual-20261103"></script>
<script src="photos.js?v=visual-20261103"></script>
<script src="discovery.js?v=visual-20261103"></script>
</body>
</html>
