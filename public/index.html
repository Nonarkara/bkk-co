<body>
<header class="bar">
  <a class="mark" href="/" aria-label="PLUB, Placemaking Laboratory Urban Bureau, home" title="PLUB · Placemaking Laboratory ; Urban Bureau">PL<span class="semi">;</span>UB</a>
  <label class="search">
    <span class="sr">Search places · <span lang="th">ค้นหาสถานที่</span></span>
    <input id="q" type="search" placeholder="Find a place · ค้นหา" autocomplete="off" enterkeyhint="search">
  </label>
  <button id="guide" class="iconbtn plub-btn" aria-label="Nong Plub's guide: neighbourhoods and how places are scored"></button>
  <button id="passport" class="iconbtn pass-btn" aria-label="Your notebook"><span>Notes</span><b id="pass-n">0</b></button>
  <ul id="hits" class="hits" role="listbox" hidden></ul>
</header>

<nav class="chips" aria-label="Filters">
  <button id="list-toggle" class="phone-only" aria-pressed="false" title="Find, explore, list and filters">☰ List</button>
  <button data-kind="cafe" aria-pressed="true"><i class="dot cafe"></i>Café</button>
  <button data-kind="coworking" aria-pressed="true"><i class="dot coworking"></i>Co-work</button>
  <button data-kind="library" aria-pressed="true"><i class="dot library"></i>Library</button>
  <button data-kind="restaurant" aria-pressed="false"><i class="dot restaurant"></i>Food</button>
</nav>

<main id="map" aria-label="Map of Great Good Places in Bangkok"></main>

<aside id="side" class="side">
  <section id="list-wrap" class="list-wrap" aria-label="Places in view">
    <div class="list-tools">
      <button class="list-find" data-act="work">Find a work spot</button>
      <details class="list-explore"><summary>Explore</summary><div class="moods" aria-label="Explore places">
        <button data-act="featured">Featured places</button><button data-act="discovery">50 + 50 source lists</button>
        <button data-act="street">Street sketch</button><button data-act="media">People &amp; café videos</button>
        <button data-proxy="atlas-open">Map views</button><button data-act="now">Near me now</button><button data-act="hop">Café hop</button>
        <button data-mood="slow" aria-pressed="false">Slow mornings</button><button data-mood="midnight" aria-pressed="false">Past midnight</button>
        <button data-mood="crossing" aria-pressed="false">Crossing paths</button><button data-mood="afterwork" aria-pressed="false">After work</button>
        <button data-proxy="atlas-key">Map key</button>
      </div></details>
      <details class="list-filters"><summary>Filters<span id="list-filter-count"></span></summary><div class="flags" aria-label="Filters">
        <button data-flag="wifi" aria-pressed="false" title="Wi-Fi listed or rated">≋ Wi-Fi</button>
        <button data-flag="open" aria-pressed="false" title="Open now where hours are known">◷ Open</button>
        <button data-flag="indie" aria-pressed="false" title="No chain signal">◇ Indie</button>
        <button data-flag="visited" aria-pressed="false" title="Places you visited">✓ Been</button>
      </div><p class="src" id="list-matching"></p></details>
      <button class="close list-close phone-only" aria-label="Close list">×</button>
    </div>
    <p id="mood" class="mood-bar" hidden aria-live="polite"></p>
    <div class="list-scope">
      <output id="count" class="count" aria-live="polite">Loading places…</output>
      <label class="list-order"><span class="sr">Sort places</span><select id="list-order" aria-label="Sort places">
        <option value="near">Near map centre</option><option value="great">Source index</option><option value="popular">Dataset footprint</option>
        <option value="notable">Notable records</option><option value="work">Work signals</option>
      </select></label>
    </div>
    <ol id="list" class="list"></ol>
  </section>
  <section id="sheet" class="sheet" hidden aria-live="polite"></section>
</aside>
