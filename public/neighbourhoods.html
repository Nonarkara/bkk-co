<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neighbourhood comparison · PLUB</title>
<link rel="stylesheet" href="style.css?v=green-20261115">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body class="hoods-shell">
<header class="bar">
  <div class="bar-brand">
    <a class="mark" href="/" aria-label="PLUB, Placemaking Laboratory Urban Bureau, home">PL<span class="semi">;</span>UB</a>
  </div>
  <span class="micro hoods-crumb">Neighbourhood atlas · 12 mapped strolls</span>
  <div class="bar-actions" style="margin-left:auto">
    <a href="/day?task=live" class="bar-btn">Compare as a base →</a>
    <a href="/" class="bar-btn">Map</a>
  </div>
</header>
<main class="page">
  <header class="hoods-head">
    <div>
      <p class="micro">12 SOURCED STREET SKETCH AREAS · 800 M RADIUS EACH</p>
      <h1>Twelve neighbourhood strolls</h1>
    </div>
    <p class="src">Comparison of sourced street sketch areas. Unknown buildings stay flat. Height numbers are explicit OSM heights only. <a href="/day?task=live">Compare areas as a base →</a></p>
  </header>
  <div id="compare"></div>
</main>
<script src="neighbourhoods.js"></script>
<style>
body.hoods-shell{display:grid;grid-template:"bar" auto "main" 1fr / 100%;height:100dvh;overflow:hidden;background:var(--paper)}
.hoods-crumb{padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{grid-area:main;overflow-y:auto;padding:16px var(--pad) 28px;max-width:1180px;width:100%;margin:0 auto}
.hoods-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.hoods-head h1{font-size:var(--big);font-weight:600;line-height:1.2;margin-top:2px}
.hoods-head .src{font-size:var(--small);color:var(--muted);max-width:62ch}
.hood-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px;margin-top:12px}
.hood-card{display:flex;flex-direction:column;gap:4px;border:1px solid var(--rule);padding:10px 12px;background:var(--paper)}
.hood-card h2{margin:0;font-size:var(--big);font-weight:600;line-height:1.25}
.hood-card .th{font-weight:400;font-size:var(--body);margin-left:6px;color:var(--muted)}
.hood-card .hood-primary{font-size:var(--body);color:var(--ink);margin-top:2px}
.hood-card .meta{margin:0;font-size:var(--small);color:var(--muted)}
.hood-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid var(--rule)}
.hood-actions a{display:inline-flex;align-items:center;min-height:32px;padding:0 8px;border:1px solid var(--ink);font-size:var(--small);font-weight:500;text-decoration:none}
.hood-actions a:last-child{border-color:var(--rule);color:var(--muted)}
.hood-actions a:hover{border-color:var(--ink);color:var(--ink)}
</style>
</body>
</html>
