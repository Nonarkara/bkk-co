name: PLUB notebook boundaries
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same branch, or a newer commit on the same pull request,
# replaces the run already in progress.
concurrency:
  group: notebook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/stroll-graph.mjs
      - run: node test/footprint-neighborhood.mjs
      - run: PLUB_VENDOR_INDEX=1 node test/maplibre-vendor.mjs
      - run: node test/amenity-race.mjs
      - run: node test/preferences-model.mjs
      - run: node test/neighborhood-photos.mjs
      - run: node test/street-world.mjs
      - run: node test/manga-lens.mjs
      - run: node test/manga-motion.mjs
      - run: node test/footprint-model.mjs
      - run: node test/footprint-palette.mjs
      - run: node test/hop-logs.mjs
      - run: node test/agent-api.mjs
      - run: node test/club-isolation.mjs
      - run: node test/cannabis-catalogue.mjs
      - run: node scripts/stamp-assets.mjs --check
      - run: node test/stamp-hook.mjs
      - run: node test/work-atmosphere.mjs
      - run: node test/venue-reports.mjs
      - run: node test/neighborhood-palette.mjs
      - run: node test/data-role-palette.mjs
      - run: node test/no-platform-scraping.mjs
      - run: node test/security-headers.mjs
      - run: node test/public-surfaces.mjs
      - run: node test/street-model.mjs
      - run: node test/map-motion.mjs
      - run: node test/aliases.mjs
      - run: node test/place-tools.mjs
      - run: node test/check.mjs
      - run: node test/atlas.mjs
      - run: node scripts/build-journey-evidence.mjs --check
      - run: node test/journeys.mjs
      - run: node test/notebook-races.mjs
      - run: node test/notebook-dates.mjs
      - run: node test/discovery.mjs
      - run: node test/talk-media.mjs
      - run: node test/einstein-hat.mjs
      - run: TZ=America/New_York node test/hours-timezone.mjs
      - run: python3 test/enrichment.py
      - name: Check browser and Worker syntax
        run: |
          for file in public/*.js src/*.js test/*.mjs; do node --check "$file"; done
      - name: Bundle Worker
        run: npx --yes wrangler@4.81.1 deploy --dry-run
      # Design law gate: MSH / glance path / kinetic grids. Scans what ships.
      # Fails only on genuine SLOP so a real regression cannot pass silently.
      - name: Design law (non-slop)
        run: npx --yes github:Nonarkara/Non-Slop scan public src --fail-on slop

  # MSH is a measured law, not an assertion. This job measures the shipped interface at
  # 390 / 1024 / 1440 and then proves the gate can fail, so a silent regression cannot pass.
  # It waits for `check`. A failed node check does not keep this browser job running.
  msh:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright, Chromium and Wrangler
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null 2>&1
          npm i playwright@1.61.0 wrangler@4.81.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium
          echo "$RUNNER_TEMP/pw/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Recover shared places without a basemap
        env:
          PLUB_PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright
        run: |
          npx --yes wrangler@4.81.1 dev --port 43976 > "$RUNNER_TEMP/shared-place-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:43976/ > /dev/null; then break; fi
            sleep 1
          done
          node test/shared-place-recovery.mjs
      - name: MSH audit (chrome, task, geometry, hierarchy, preservation)
        env:
          PLUB_PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright
        run: node scripts/audit-msh.mjs
      - name: MSH gate must fail on a planted defect
        env:
          PLUB_PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright
        run: node scripts/audit-msh.mjs --planted
