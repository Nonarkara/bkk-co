name: PLUB notebook boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/street-world.mjs
      - run: node test/manga-lens.mjs
      - run: node test/manga-motion.mjs
      - run: node test/hop-logs.mjs
      - run: node test/street-model.mjs
      - run: node test/map-motion.mjs
      - run: node test/aliases.mjs
      - run: node test/place-tools.mjs
      - run: node test/check.mjs
      - run: node test/atlas.mjs
      - run: node test/journeys.mjs
      - run: node test/notebook-races.mjs
      - run: node test/notebook-dates.mjs
      - run: node test/discovery.mjs
      - run: node test/talk-media.mjs
      - run: node test/einstein-hat.mjs
      - run: TZ=America/New_York node test/hours-timezone.mjs
      - run: python3 test/enrichment.py
      - name: Check browser and Worker syntax
        run: |
          for file in public/*.js src/*.js test/*.mjs; do node --check "$file"; done
      - name: Bundle Worker
        run: npx --yes wrangler@4.81.1 deploy --dry-run
      # Design law gate: MSH / glance path / kinetic grids. Scans what ships.
      # Fails only on genuine SLOP so a real regression cannot pass silently.
      - name: Design law (non-slop)
        run: npx --yes github:Nonarkara/Non-Slop scan public src --fail-on slop
