name = "bkk-co"
main = "src/worker.js"
compatibility_date = "2026-04-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true  # needed so bkkco.nonarkara.org can 301 before assets are served

[[d1_databases]]
binding = "DB"
database_name = "bkk-co"
database_id = "543b6326-c7a5-410d-aa30-81d6a92ea4a0"

[[routes]]
pattern = "co.nonarkara.org"
custom_domain = true

[[routes]]
pattern = "bkkco.nonarkara.org"
custom_domain = true
